name: Проверка и воспроизведение анализа
on: [push, pull_request]
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace-product-analytics
    steps:
      - name: Загрузка исходного кода
        uses: actions/checkout@v4
      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marketplace-product-analytics/requirements-lock.txt
      - name: Установка зависимостей
        run: pip install -r requirements-lock.txt
      - name: Выполнение тестов
        run: python -m pytest -q
      - name: Воспроизведение анализа
        run: python -m src.pipeline
